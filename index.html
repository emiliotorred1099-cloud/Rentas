<title>Rentas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font:20px/1.4 -apple-system,system-ui,sans-serif;background:#f4f4f2;color:#222;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:16px}h1{font-size:28px;margin:8px 0 16px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:18px;font-size:20px;font-weight:700;background:#1f6feb;color:#fff;margin:10px 0}
.btn.ok{background:#1a9b4b}.btn.gris{background:#ddd;color:#222}
.card{background:#fff;border-radius:14px;padding:16px;margin:10px 0;border-left:10px solid #ccc}
.card.rojo{border-color:#d93025}.card.amarillo{border-color:#f5b400}.card.verde{border-color:#1a9b4b}
.n{font-size:24px;font-weight:700}.sub{color:#666;font-size:17px}
input{width:100%;font-size:20px;padding:14px;margin:6px 0;border:1px solid #bbb;border-radius:12px}
.res{display:flex;gap:8px}.res div{flex:1;background:#fff;border-radius:14px;padding:12px;text-align:center}
</style></head><body><main id="app"></main>
<script>
// ⚠️ Pega aquí los datos de tu proyecto Supabase (Settings > API)
const SUPABASE_URL='https://lwhukwhjxyzgcpnfulwc.supabase.co', SUPABASE_KEY='sb_publishable_DV9O6nsBv1TYhI0k9w28XA_f8_SDwhS';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=document.getElementById('app'), mxn=n=>Number(n).toLocaleString('es-MX',{style:'currency',currency:'MXN'});
const hoy=()=>new Date().toLocaleDateString('en-CA');
let yo=null, filas=[];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const estado=o=>o.pagada?'verde':o.vence<hoy()?'rojo':o.vence===hoy()?'amarillo':(o.vence<=suma(7)?'amarillo':'');
function suma(d){const x=new Date();x.setDate(x.getDate()+d);return x.toLocaleDateString('en-CA')}
const fecha=f=>new Date(f+'T12:00').toLocaleDateString('es-MX',{day:'numeric',month:'long'});

async function init(){
  const {data:{session}}=await db.auth.getSession();
  if(!session) return login();
  const {data}=await db.from('users').select('*').eq('id',session.user.id).single();
  yo=data; if(yo?.rol==='admin') await db.rpc('generar_obligaciones',{meses:12});
  inicio();
}
function login(msg=''){ $.innerHTML=`<h1>Rentas</h1><p>${msg}</p>
<input id="e" type="email" placeholder="Correo" autocapitalize="off"><input id="p" type="password" placeholder="Contraseña">
<button class="btn" onclick="entrar()">ENTRAR</button>`}
async function entrar(){const {error}=await db.auth.signInWithPassword({email:e.value,password:p.value});
  error?login('Correo o contraseña incorrectos'):init()}
async function cargar(){
  const {data,error}=await db.from('rental_obligations')
    .select('id,periodo,vence,monto,pagada,tenants(nombre,telefono,units(nombre,properties(nombre)))')
    .order('vence'); if(error) alert(error.message); filas=data||[]}
async function inicio(){
  await cargar(); const h=hoy(), mes=h.slice(0,7);
  const venc=filas.filter(o=>!o.pagada&&o.vence<h), vh=filas.filter(o=>!o.pagada&&o.vence===h),
        prox=filas.filter(o=>!o.pagada&&o.vence>h&&o.vence<=suma(7)),
        cob=filas.filter(o=>o.pagada&&o.periodo.slice(0,7)===mes),
        pend=filas.filter(o=>!o.pagada&&o.vence<=suma(30)).reduce((s,o)=>s+ +o.monto,0),
        cobT=cob.reduce((s,o)=>s+ +o.monto,0);
  const sal=new Date().getHours()<12?'BUENOS DÍAS':new Date().getHours()<19?'BUENAS TARDES':'BUENAS NOCHES';
  $.innerHTML=`<h1>${sal}</h1>
  <div class="card rojo"><span class="n">🔴 Vencidas: ${venc.length}</span></div>
  <div class="card amarillo"><span class="n">🟡 Vencen hoy: ${vh.length}</span><div class="sub">Próximas (7 días): ${prox.length}</div></div>
  <div class="card verde"><span class="n">🟢 Pagadas este mes: ${cob.length}</span></div>
  ${yo.rol!=='consulta'||true?`<div class="sub">Por cobrar (próx. 30 días y vencidas): <b>${mxn(pend)}</b><br>Cobrado este mes: <b>${mxn(cobT)}</b></div>`:''}
  <button class="btn" onclick="lista('hoy')">VER RENTAS DE HOY</button>
  <button class="btn" onclick="lista('vencidas')">VER VENCIDAS</button>
  <button class="btn" onclick="lista('todas')">TODAS LAS RENTAS</button>
  <button class="btn gris" onclick="inquilinos()">INQUILINOS</button>
  <button class="btn gris" onclick="db.auth.signOut().then(init)">Salir</button>`}
function tarjeta(o){const t=o.tenants,e=estado(o),puede=yo.rol!=='consulta';
  return `<div class="card ${e}"><div class="n">${esc(t.nombre)}</div>
  <div class="sub">${esc(t.units.properties.nombre)} · ${esc(t.units.nombre)}</div>
  <div class="n">${mxn(o.monto)}</div><div class="sub">Vence: ${fecha(o.vence)} · ${o.pagada?'PAGADA':e==='rojo'?'VENCIDA':'PENDIENTE'}</div>
  ${!o.pagada&&puede?`<button class="btn ok" onclick="pagar('${o.id}','${esc(t.nombre)}')">✓ MARCAR COMO PAGADA</button>`:''}</div>`}
function lista(f){const h=hoy();
  const l=filas.filter(o=>f==='hoy'?(!o.pagada&&o.vence<=h)||(!o.pagada&&o.vence<=suma(3)):f==='vencidas'?!o.pagada&&o.vence<h:!o.pagada);
  $.innerHTML=`<button class="btn gris" onclick="inicio()">← Inicio</button><h1>${{hoy:'Rentas de hoy',vencidas:'Vencidas',todas:'Pendientes'}[f]}</h1>`+(l.map(tarjeta).join('')||'<p>No hay rentas aquí 🎉</p>')}
async function pagar(id,n){if(!confirm('¿Marcar como pagada la renta de '+n+'?'))return;
  const {error}=await db.rpc('marcar_pagada',{p_obligation:id}); if(error)return alert(error.message); await cargar(); inicio()}
async function inquilinos(){
  const {data}=await db.from('tenants').select('id,nombre,telefono,monto,dia_pago,activo,units(nombre,properties(nombre))').order('nombre');
  $.innerHTML=`<button class="btn gris" onclick="inicio()">← Inicio</button><h1>Inquilinos</h1>`+(data||[]).map(t=>
   `<div class="card"><div class="n">${esc(t.nombre)}</div><div class="sub">${esc(t.units.properties.nombre)} · ${esc(t.units.nombre)}<br>${mxn(t.monto)} · paga el día ${t.dia_pago}${t.activo?'':' · INACTIVO'}</div>
   ${t.telefono?`<a class="btn gris" style="text-decoration:none;text-align:center" href="tel:${esc(t.telefono)}">📞 Llamar</a>`:''}</div>`).join('')}
init();
</script></body></html>
